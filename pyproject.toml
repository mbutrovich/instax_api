[project]
name = "instax-api"
version = "0.8.0"
description = "A Python module and app to print photos on the Fujifim Instax Printers"
authors = [{ name = "James Sutton", email = "james@jsutton.co.uk" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.3.0",
    "loguru>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/jpwsutton/instax_api"

[dependency-groups]
dev = [
    "gitlint>=0.17.0",
    "pre-commit>=2.20.0",
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "instax"
module-root = ""
