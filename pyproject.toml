[project]
name = "instax-api"
version = "0.9.0"
description = "Print photos on Fujifilm Instax SHARE SP-2 and SP-3 printers over Wi-Fi"
authors = [{ name = "James Sutton", email = "james@jsutton.co.uk" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.3.0",
]

[project.scripts]
instax-print = "instax.cli:main"
instax-simulator = "instax.simulator:main"

[project.urls]
Homepage = "https://github.com/mbutrovich/instax_api"

[dependency-groups]
dev = [
    "gitlint>=0.17.0",
    "pre-commit>=2.20.0",
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "instax"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["instax", "tests"]
addopts = "--doctest-modules"
